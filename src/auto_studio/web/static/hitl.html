<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>auto_studio · Web HITL</title>
  <script>
    (function () {
      var key = "auto_studio_hitl_theme";
      var theme = localStorage.getItem(key);
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    html {
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --radius-sm: 6px;
      --radius-md: 10px;
      --font: ui-sans-serif, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", monospace;
      --focus-border: rgba(37, 99, 235, 0.55);
      --focus-ring: rgba(37, 99, 235, 0.2);
      --layout-max: 100%;
      --gutter: clamp(0.75rem, 1.5vw, 1.25rem);
      --app-bar-h: 3.25rem;
      --sidebar-w: 15.5rem;
      --inspect-w: min(26rem, 32vw);
      --rail-border: var(--border);
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg-base: #f4f4f5;
      --bg-elevated: #ffffff;
      --bg-input: #fafafa;
      --border: rgba(0, 0, 0, 0.1);
      --text-primary: #18181b;
      --text-secondary: #52525b;
      --text-muted: #71717a;
      --warn-bg: rgba(234, 179, 8, 0.14);
      --warn-border: rgba(202, 138, 4, 0.45);
      --warn-fg: #713f12;
      --error-fg: #991b1b;
      --error-bg: rgba(239, 68, 68, 0.08);
      --error-border: rgba(239, 68, 68, 0.35);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 14px rgba(0, 0, 0, 0.06);
      --surface-hover: rgba(0, 0, 0, 0.04);
      --btn-primary-fg: #ffffff;
      --spinner-track: rgba(255, 255, 255, 0.35);
      --spinner-head: #ffffff;
      --toggle-bg: #ffffff;
      --toggle-fg: #18181b;
      --toggle-border: rgba(0, 0, 0, 0.12);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg-base: #18181b;
      --bg-elevated: #1f1f23;
      --bg-input: #27272a;
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: rgba(255, 255, 255, 0.92);
      --text-secondary: rgba(255, 255, 255, 0.62);
      --text-muted: rgba(255, 255, 255, 0.42);
      --warn-bg: rgba(234, 179, 8, 0.12);
      --warn-border: rgba(234, 179, 8, 0.35);
      --warn-fg: rgba(255, 255, 255, 0.9);
      --error-fg: #fecaca;
      --error-bg: rgba(239, 68, 68, 0.12);
      --error-border: rgba(239, 68, 68, 0.3);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.24), 0 4px 12px rgba(0, 0, 0, 0.18);
      --surface-hover: rgba(255, 255, 255, 0.04);
      --btn-primary-fg: #ffffff;
      --spinner-track: rgba(255, 255, 255, 0.25);
      --spinner-head: #ffffff;
      --toggle-bg: #27272a;
      --toggle-fg: rgba(255, 255, 255, 0.92);
      --toggle-border: rgba(255, 255, 255, 0.12);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--bg-base);
      -webkit-font-smoothing: antialiased;
    }

    .app-frame {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-bar {
      position: sticky;
      top: 0;
      z-index: 15;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);
      backdrop-filter: blur(10px);
    }

    .app-bar-inner {
      padding: 0.65rem var(--gutter);
      min-height: var(--app-bar-h);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .app-nav {
      display: flex;
      gap: 0.35rem;
    }

    .app-nav a {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 0.35rem 0.65rem;
      border-radius: var(--radius-sm);
    }

    .app-nav a:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .app-nav a.is-active {
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .app-bar-meta { margin-left: auto; }

    .app-bar-inner h1 {
      margin: 0;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .app-bar-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--mono);
    }

    /* Codex 式：左导航 · 中操作 · 右检视（Claude Artifacts / Gemini Run settings） */
    .app-shell {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      min-height: calc(100vh - var(--app-bar-h));
    }

    @media (min-width: 900px) {
      .app-shell {
        grid-template-columns: var(--sidebar-w) 1fr var(--inspect-w);
      }
    }

    .sidebar {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      padding: var(--gutter);
      border-right: 1px solid var(--rail-border);
      background: var(--bg-elevated);
    }

    @media (min-width: 900px) {
      .sidebar { display: flex; }
    }

    .sidebar-brand {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .sidebar-label {
      display: block;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .run-list-item {
      font-size: 0.8125rem;
      font-family: var(--mono);
      color: var(--text-secondary);
      padding: 0.5rem 0.6rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-input);
      word-break: break-all;
    }

    .run-list-item.is-active {
      border-color: var(--focus-border);
      color: var(--text-primary);
    }

    .sidebar-hint {
      margin-top: auto;
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .workspace-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: var(--gutter);
      padding-bottom: 2rem;
      overflow: auto;
    }

    .workspace-inspect {
      min-width: 0;
      border-top: 1px solid var(--rail-border);
      background: color-mix(in srgb, var(--bg-elevated) 96%, var(--bg-base));
      display: flex;
      flex-direction: column;
      max-height: 42vh;
      overflow: auto;
    }

    @media (min-width: 900px) {
      .workspace-inspect {
        border-top: none;
        border-left: 1px solid var(--rail-border);
        max-height: none;
        position: sticky;
        top: var(--app-bar-h);
        height: calc(100vh - var(--app-bar-h));
      }
    }

    .inspect-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.75rem var(--gutter);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .inspect-head h2 {
      margin: 0;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .inspect-body {
      padding: var(--gutter);
      flex: 1;
      overflow: auto;
    }

    .composer-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 52rem;
    }

    .field-row {
      display: grid;
      gap: 0.75rem;
    }

    @media (min-width: 640px) {
      .field-row { grid-template-columns: 1fr 1fr; }
    }

    .gate-card {
      margin-top: 1.25rem;
      padding: 1rem 1.1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--warn-border);
      background: var(--warn-bg);
      max-width: 52rem;
    }

    .gate-card[hidden] { display: none !important; }

    .gate-card h3 {
      margin: 0 0 0.35rem;
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--warn-fg);
    }

    .gate-card .gate-id {
      margin-bottom: 0.85rem;
    }

    .main-divider {
      margin: 1.25rem 0;
      border: none;
      border-top: 1px solid var(--border);
      max-width: 52rem;
    }

    .section-title {
      margin: 0 0 0.65rem;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .phase-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 500;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
    }

    .phase-pill[data-phase="awaiting_human"] {
      border-color: var(--warn-border);
      background: var(--warn-bg);
      color: var(--warn-fg);
    }

    .phase-pill[data-phase="completed"] {
      border-color: color-mix(in srgb, var(--success) 35%, transparent);
      color: var(--success);
    }

    .phase-pill[data-phase="rejected"] {
      border-color: color-mix(in srgb, var(--danger) 35%, transparent);
      color: var(--danger);
    }

    .phase-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.9;
    }

    .panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem 1.1rem;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 0.85rem;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    label {
      display: block;
      margin-top: 0.85rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    label:first-of-type { margin-top: 0; }

    .hint {
      font-weight: 400;
      color: var(--text-muted);
    }

    input, textarea, select {
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.55rem 0.65rem;
      font: inherit;
      color: var(--text-primary);
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--focus-border);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    input[readonly] {
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 0.8125rem;
    }

    textarea { resize: vertical; min-height: 4.5rem; }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    button {
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--btn-primary-fg);
    }

    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-secondary {
      background: transparent;
      color: var(--text-primary);
      border-color: var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--surface-hover);
    }

    .gate-banner {
      margin-top: 1rem;
      padding: 0.75rem 0.85rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--warn-border);
      background: var(--warn-bg);
      font-size: 0.875rem;
      line-height: 1.45;
    }

    .gate-banner[hidden] { display: none !important; }

    .gate-banner strong {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .gate-id {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }

    .inline-error {
      margin-top: 0.75rem;
      padding: 0.5rem 0.65rem;
      font-size: 0.8125rem;
      color: var(--error-fg);
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: var(--radius-sm);
    }

    .inline-error[hidden] { display: none !important; }

    .status-empty {
      color: var(--text-muted);
      font-size: 0.875rem;
      padding: 0.5rem 0;
    }

    .status-dl {
      margin: 0;
      display: grid;
      gap: 0.65rem;
    }

    .status-row {
      display: grid;
      grid-template-columns: minmax(4.5rem, 6.5rem) 1fr;
      gap: 0.65rem 1rem;
      font-size: 0.8125rem;
    }

    @media (min-width: 900px) {
      #req { min-height: 8rem; }
      details.raw pre { max-height: min(18rem, 35vh); }
    }

    .sidebar-new {
      width: 100%;
      justify-content: center;
    }

    .status-row dt {
      margin: 0;
      color: var(--text-muted);
    }

    .status-row dd {
      margin: 0;
      word-break: break-all;
    }

    .status-row dd.mono { font-family: var(--mono); font-size: 0.75rem; }

    details.raw {
      margin-top: 1rem;
      font-size: 0.75rem;
    }

    details.raw summary {
      cursor: pointer;
      color: var(--text-muted);
      user-select: none;
    }

    details.raw pre {
      margin: 0.5rem 0 0;
      padding: 0.75rem;
      max-height: 14rem;
      overflow: auto;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--mono);
      font-size: 0.6875rem;
      line-height: 1.45;
      color: var(--text-secondary);
    }

    .btn-loading {
      position: relative;
      color: transparent !important;
    }

    .btn-loading::after {
      content: "";
      position: absolute;
      inset: 0;
      margin: auto;
      width: 1rem;
      height: 1rem;
      border: 2px solid var(--spinner-track);
      border-top-color: var(--spinner-head);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .btn-loading::after { animation: none; opacity: 0.85; }
      * { transition-duration: 0.01ms !important; }
    }

    .theme-toggle {
      position: fixed;
      right: var(--gutter);
      bottom: 1rem;
      z-index: 20;
      padding: 0.45rem 0.75rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--toggle-fg);
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      border-radius: 999px;
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    .theme-toggle:hover {
      background: var(--bg-elevated);
      border-color: var(--focus-border);
    }

    .theme-toggle:focus-visible {
      outline: none;
      box-shadow: var(--shadow), 0 0 0 3px var(--focus-ring);
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <header class="app-bar">
      <div class="app-bar-inner">
        <nav class="app-nav" aria-label="主导航">
          <a href="/" class="is-active">HITL</a>
          <a href="/config">配置</a>
        </nav>
        <h1>auto_studio · Web HITL</h1>
        <span class="app-bar-meta" id="appBarThread" title="">未绑定 Run</span>
      </div>
    </header>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Run 导航">
        <span class="sidebar-brand">软件工厂</span>
        <button type="button" class="btn-primary sidebar-new" id="btnSidebarNew">新建 Run</button>
        <nav>
          <span class="sidebar-label">当前 Run</span>
          <div class="run-list-item" id="sidebarThread">尚无</div>
        </nav>
      </aside>

      <main class="workspace-main" aria-label="操作区">
        <div class="composer-block">
          <p class="section-title">需求输入</p>
          <label for="req">描述本轮交付目标 <span class="hint">human_request</span></label>
          <textarea id="req" rows="5" placeholder="例如：为 npu_operator 场景实现 Mul 算子，含单测与性能基线…"></textarea>

          <div class="field-row">
            <div>
              <label for="scenario">场景 <span class="hint">scenario_key</span></label>
              <select id="scenario"></select>
            </div>
            <div>
              <label for="project">项目 <span class="hint">project_id</span></label>
              <select id="project"></select>
            </div>
          </div>

          <input id="thread" type="hidden" />

          <div class="row-actions">
            <button type="button" class="btn-primary" id="btnStart">启动本轮</button>
          </div>
          <p class="inline-error" id="startError" hidden role="alert"></p>

          <hr class="main-divider" />

          <p class="section-title">人工关卡</p>
          <div class="gate-card" id="banner" hidden role="status">
            <h3 id="bannerText">等待人工批复</h3>
            <div class="gate-id" id="bannerGate"></div>
            <label for="decision">决定</label>
            <select id="decision">
              <option value="approved">批准 — 继续流程</option>
              <option value="rejected">驳回 — 终止本轮</option>
            </select>
            <label for="reply">附言 <span class="hint">human_reply</span></label>
            <textarea id="reply" rows="3" placeholder="补充范围说明或驳回原因…"></textarea>
            <div class="row-actions">
              <button type="button" class="btn-primary" id="btnSubmit" disabled>提交并续跑</button>
              <button type="button" class="btn-secondary" id="btnRefresh">刷新状态</button>
            </div>
            <p class="inline-error" id="hitlError" hidden role="alert"></p>
          </div>
          <p class="status-empty" id="gateIdleHint">启动 Run 后，流程在关卡处暂停时，此处会出现批复表单。</p>
        </div>
      </main>

      <aside class="workspace-inspect" aria-label="运行检视">
        <div class="inspect-head">
          <h2>运行检视</h2>
          <div class="phase-pill" id="phasePill" data-phase="idle" aria-live="polite">
            <span class="phase-dot" aria-hidden="true"></span>
            <span id="phaseLabel">未启动</span>
          </div>
        </div>
        <div class="inspect-body">
          <div id="statusHuman">
            <p class="status-empty">尚无状态；启动 Run 或刷新后显示阶段、下一节点与基线摘要。</p>
          </div>
          <details class="raw">
            <summary>原始 JSON</summary>
            <pre id="out">{}</pre>
          </details>
        </div>
      </aside>
    </div>
  </div>

  <button type="button" class="theme-toggle" id="themeToggle" aria-label="切换浅色与深色主题">夜晚</button>

  <script>
    const $ = (id) => document.getElementById(id);
    const PHASE_LABELS = {
      idle: "未启动",
      running: "运行中",
      awaiting_human: "等待人工",
      completed: "已完成",
      rejected: "已驳回",
    };

    function setPhase(phase) {
      const p = phase || "idle";
      $("phasePill").dataset.phase = p;
      $("phaseLabel").textContent = PHASE_LABELS[p] || p;
    }

    function showError(el, msg) {
      if (!msg) {
        el.hidden = true;
        el.textContent = "";
        return;
      }
      el.hidden = false;
      el.textContent = msg;
    }

    function setLoading(btn, on) {
      btn.disabled = on;
      btn.classList.toggle("btn-loading", on);
    }

    function syncUrlThread(tid) {
      const url = new URL(window.location.href);
      if (tid) url.searchParams.set("thread_id", tid);
      else url.searchParams.delete("thread_id");
      history.replaceState(null, "", url);
    }

    function syncThreadChrome(tid) {
      const el = $("sidebarThread");
      el.textContent = tid || "尚无";
      el.classList.toggle("is-active", !!tid);
      el.title = tid || "";
      $("appBarThread").textContent = tid ? tid.slice(0, 8) + "…" : "未绑定 Run";
      $("appBarThread").title = tid || "";
    }

    function renderHumanStatus(data) {
      const box = $("statusHuman");
      if (!data || !data.thread_id) {
        box.innerHTML = '<p class="status-empty">尚未启动 Run，或输入 thread_id 后点「刷新状态」。</p>';
        setPhase("idle");
        return;
      }
      setPhase(data.phase);
      const ah = data.awaiting_human;
      const rows = [
        ["Run ID", data.thread_id, true],
        ["阶段", PHASE_LABELS[data.phase] || data.phase, false],
        ["下一节点", (data.next_nodes || []).join(", ") || "—", false],
      ];
      if (ah) {
        rows.push(["待办类型", ah.kind, false]);
        rows.push(["关卡", ah.gate_id || "—", true]);
      }
      const vals = data.values || {};
      if (vals.baseline_log) {
        const tail = String(vals.baseline_log).split("\n").slice(-2).join("\n");
        rows.push(["最近基线", tail, true]);
      }
      box.innerHTML =
        '<dl class="status-dl">' +
        rows.map(([k, v, mono]) =>
          `<div class="status-row"><dt>${k}</dt><dd class="${mono ? "mono" : ""}">${escapeHtml(String(v))}</dd></div>`
        ).join("") +
        "</dl>";
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function refresh() {
      const tid = $("thread").value.trim();
      showError($("hitlError"), "");
      if (!tid) {
        renderHumanStatus(null);
        syncThreadChrome("");
        $("out").textContent = "{}";
        $("btnSubmit").disabled = true;
        $("banner").hidden = true;
        $("gateIdleHint").hidden = false;
        return;
      }
      syncThreadChrome(tid);
      setLoading($("btnRefresh"), true);
      try {
        const r = await fetch("/api/runs/" + encodeURIComponent(tid));
        const data = await r.json();
        $("out").textContent = JSON.stringify(data, null, 2);
        if (!r.ok) {
          showError($("hitlError"), data.detail || "无法读取 Run 状态");
          return;
        }
        renderHumanStatus(data);
        const ah = data.awaiting_human;
        $("btnSubmit").disabled = data.phase !== "awaiting_human";
        if (ah && ah.kind === "gate") {
          $("banner").hidden = false;
          $("gateIdleHint").hidden = true;
          $("bannerText").textContent = ah.summary;
          $("bannerGate").textContent = ah.gate_id;
        } else {
          $("banner").hidden = true;
          $("gateIdleHint").hidden = false;
        }
      } finally {
        setLoading($("btnRefresh"), false);
      }
    }

    $("btnStart").onclick = async () => {
      showError($("startError"), "");
      const body = {
        human_request: $("req").value.trim(),
        scenario_key: $("scenario").value.trim(),
        project_id: $("project").value.trim(),
      };
      if (!body.human_request) {
        showError($("startError"), "请先填写需求说明。");
        $("req").focus();
        return;
      }
      const btn = $("btnStart");
      setLoading(btn, true);
      try {
        const r = await fetch("/api/runs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await r.json();
        $("out").textContent = JSON.stringify(data, null, 2);
        if (!r.ok) {
          showError($("startError"), data.detail || "启动失败，请检查场景或项目配置。");
          return;
        }
        $("thread").value = data.thread_id;
        syncUrlThread(data.thread_id);
        await refresh();
      } finally {
        setLoading(btn, false);
      }
    };

    $("btnSubmit").onclick = async () => {
      const tid = $("thread").value.trim();
      if (!tid) return;
      showError($("hitlError"), "");
      const btn = $("btnSubmit");
      setLoading(btn, true);
      try {
        const r = await fetch("/api/runs/" + encodeURIComponent(tid) + "/hitl", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            gate_decision: $("decision").value,
            human_reply: $("reply").value,
            channel: "web",
          }),
        });
        const data = await r.json();
        $("out").textContent = JSON.stringify(data, null, 2);
        if (!r.ok) {
          showError($("hitlError"), data.detail || "提交失败，当前可能不在等待人工状态。");
          return;
        }
        $("reply").value = "";
        await refresh();
      } finally {
        setLoading(btn, false);
      }
    };

    $("btnRefresh").onclick = refresh;

    $("btnSidebarNew").onclick = () => {
      $("req").focus();
      $("req").scrollIntoView({ behavior: "smooth", block: "center" });
    };

    async function loadRunConfigOptions() {
      try {
        const [sr, pr] = await Promise.all([
          fetch("/api/config/scenarios").then((r) => r.json()),
          fetch("/api/config/projects").then((r) => r.json()),
        ]);
        const sc = $("scenario");
        sc.innerHTML = '<option value="">（不指定场景）</option>';
        for (const s of sr.scenarios || []) {
          const o = document.createElement("option");
          o.value = s.scenario_key;
          o.textContent = s.scenario_key;
          sc.appendChild(o);
        }
        const pj = $("project");
        pj.innerHTML = '<option value="">（不指定项目）</option>';
        for (const p of pr.projects || []) {
          const o = document.createElement("option");
          o.value = p.project_id;
          o.textContent = p.project_id;
          pj.appendChild(o);
        }
      } catch (_) { /* 离线或未启动 API */ }
    }

    (function initFromUrl() {
      loadRunConfigOptions().then(() => {
        const tid = new URLSearchParams(window.location.search).get("thread_id");
        if (tid) {
          $("thread").value = tid;
          refresh();
        }
      });
    })();

    (function initThemeToggle() {
      const key = "auto_studio_hitl_theme";
      const btn = $("themeToggle");

      function syncToggleLabel() {
        const dark = document.documentElement.getAttribute("data-theme") === "dark";
        btn.textContent = dark ? "白天" : "夜晚";
      }

      btn.addEventListener("click", function () {
        const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem(key, next);
        syncToggleLabel();
      });

      syncToggleLabel();
    })();
  </script>
</body>
</html>
