scenario_key: middleware
title: middleware
description: 面向中间件的接口、协议与服务实现。默认不走体验、界面和视觉。

artifacts_optional:
  - ux_spec
  - ui_spec
  - visual_assets

# 兼容层：新项目请直接选择流程 factory_default，运行档案见该流程的 profile。
migrate_to: factory_default
workflow:
  graph_id: default
  skip_nodes:
    - ux_designer
    - ui_designer
    - visual_designer
  features:
    design_track: false
  gates:
    gate_requirement_confirm: true
    gate_architecture_review: true
    gate_final_delivery: true
  limits:
    max_dev_retries: 3
