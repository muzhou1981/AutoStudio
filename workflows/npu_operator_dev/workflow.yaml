workflow_id: npu_operator_dev
title: NPU 算子开发
description: 先写算子合同。确认 CCA 时，批准进入 CCA 子图，不通过则前往确认 AOM。确认 AOM 时，批准进入 AOM 子图，不通过则前往共同评审。两条都批准时先做 CCA 再做 AOM，然后共同评审。要改，先复制一份。
builtin: true
subgraph: true
profile:
  features:
    design_track: false
  limits:
    max_dev_retries: 3
nodes:
- id: start
  kind: start
  name: 启动
  role: human
  returns_to: ''
- id: contract
  kind: activity
  name: 算子合同
  role: architect
  returns_to: ''
  inputs:
  - human_request
- id: confirm_cca
  kind: gate
  name: 确认 CCA
  role: human
  returns_to: ''
  decision: approve
  reject_to: confirm_aom
- id: cca_path
  kind: subgraph
  name: NPU 算子 CCA
  role: ''
  returns_to: ''
  subgraph_id: npu_operator_cca
- id: confirm_aom
  kind: gate
  name: 确认 AOM
  role: human
  returns_to: ''
  decision: approve
  reject_to: review
- id: aom_path
  kind: subgraph
  name: NPU 算子 AOM
  role: ''
  returns_to: ''
  subgraph_id: npu_operator_aom
- id: review
  kind: activity
  name: 共同评审
  role: code_reviewer
  returns_to: ''
- id: end
  kind: end
  name: 结束
  role: human
  returns_to: ''
