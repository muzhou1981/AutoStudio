workflow_id: self_improve
title: 自我改进
description: 日常驱动 Agent 改 GeniStudio 自身。直接在目标仓库当前检出的分支上修改，不另建工作树。先听清改动并等人确认，再改代码、自行核对。人确认入库后，由程序员在当前分支提交。各活动只产出一类主产物，避免同一段正文写入多个状态键。要改，先复制一份。
builtin: true
workspace: current_branch
profile:
  features:
    design_track: false
  limits:
    max_dev_retries: 2
nodes:
- id: start
  kind: start
  name: 启动
  role: human
  returns_to: ''
- id: hear
  kind: activity
  name: 听清改动
  role: project_manager
  returns_to: ''
  inputs:
  - human_request
  primary_output: requirement_spec
- id: confirm_change
  kind: gate
  name: 确认改动
  role: human
  returns_to: ''
  decision: approve
  reject_to: hear
- id: change_code
  kind: activity
  name: 改代码
  role: developer
  returns_to: ''
  inputs:
  - requirement_spec
  primary_output: code_change
- id: self_check
  kind: activity
  name: 自行核对
  role: tester
  returns_to: change_code
  max_loops: 3
  inputs:
  - requirement_spec
  - code_change
  primary_output: test_report
- id: review
  kind: gate
  name: 看结果
  role: human
  returns_to: ''
  decision: approve
  reject_to: change_code
- id: handoff
  kind: activity
  name: 写交付说明
  role: project_manager
  returns_to: ''
  inputs:
  - requirement_spec
  - code_change
  - test_report
  primary_output: delivery_report
- id: confirm_commit
  kind: gate
  name: 确认入库
  role: human
  returns_to: ''
  decision: approve
  reject_to: change_code
- id: land_commit
  kind: activity
  name: 提交入库
  role: developer
  returns_to: ''
  commits_on_branch: true
- id: end
  kind: end
  name: 结束
  role: human
  returns_to: ''
