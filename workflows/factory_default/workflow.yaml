workflow_id: factory_default
title: 通用软件开发
description: 工厂内置的通用软件开发流程。调用 Agent 的步骤是活动，提示词按通用活动拼装，判定与状态写入由 effect 指向的内置后处理完成；不调用 Agent 的步骤是系统节点。路由与可选分支在本文件声明。要改，先复制一份。
builtin: true
hidden: true
rail: builtin
profile:
  features:
    design_track: true
  gates:
    gate_requirement_confirm: true
    gate_architecture_review: true
    gate_final_delivery: true
  limits:
    max_dev_retries: 3
nodes:
- id: start
  kind: start
  name: 启动
  role: human
  returns_to: ''
- id: project_manager_draft
  kind: activity
  name: 项目经理起草
  role: project_manager
  returns_to: ''
  inputs: []
  outputs:
  - requirement_spec
  instruction: 需求说明须含可检验的验收标准 AC-*。
- id: pm_clarification_check
  kind: system
  name: 澄清检查
  role: project_manager
  returns_to: ''
  handler: pm_clarification_check
  routes:
  - when: pending:pm_clarification
    to: hitl_pause
- id: tester_testability
  kind: activity
  name: 可测性
  role: tester
  returns_to: ''
  inputs:
  - requirement_spec
  outputs:
  - testability_review
  instruction: 指出可测试性风险与建议。
- id: gate_requirement_confirm
  kind: gate
  name: 需求确认
  role: human
  returns_to: ''
  decision: approve
- id: config_manager_plan
  kind: system
  name: 配置计划
  role: config_manager
  returns_to: ''
  handler: config_manager_plan
- id: ux_designer
  kind: activity
  name: 体验
  role: ux_designer
  returns_to: ''
  inputs:
  - requirement_spec
  outputs:
  - ux_spec
  when: feature:design_track
- id: ui_designer
  kind: activity
  name: 界面
  role: ui_designer
  returns_to: ''
  inputs:
  - ux_spec
  outputs:
  - ui_spec
  when: feature:design_track
- id: visual_designer
  kind: activity
  name: 视觉
  role: visual_designer
  returns_to: ''
  inputs:
  - ui_spec
  outputs:
  - visual_assets
  instruction: visual_assets 写视觉资源清单说明。
  when: feature:design_track
- id: finance_budget_rough
  kind: activity
  name: 预算粗估
  role: finance
  returns_to: ''
  inputs:
  - requirement_spec
  outputs:
  - budget_plan
  instruction: 这是需求确认前的预算粗估。
  effect: budget_rough
  when: feature:finance
- id: project_manager_scope
  kind: system
  name: 范围
  role: project_manager
  returns_to: ''
  handler: project_manager_scope
- id: architect
  kind: activity
  name: 架构
  role: architect
  returns_to: ''
  inputs:
  - requirement_spec
  outputs:
  - architecture_design
  - task_plan
  instruction: task_plan 写任务拆分与依赖。
- id: finance_budget_final
  kind: activity
  name: 预算正式版
  role: finance
  returns_to: ''
  inputs:
  - architecture_design
  outputs:
  - budget_plan
  instruction: 这是架构评审前的预算正式版。
  effect: budget_final
  when: feature:finance
- id: gate_architecture_review
  kind: gate
  name: 架构评审
  role: human
  returns_to: ''
  decision: approve
- id: developer
  kind: activity
  name: 开发
  role: developer
  returns_to: ''
  inputs:
  - architecture_design
  - task_plan
  outputs:
  - code_change
  - change_request
  instruction: code_change 写本轮代码变更说明。
  effect: developer
- id: change_control
  kind: system
  name: 变更
  role: developer
  returns_to: ''
  handler: change_control
  routes:
  - when: impact:scope
    to: gate_requirement_confirm
  - when: impact:architecture
    to: gate_architecture_review
- id: code_reviewer
  kind: activity
  name: 评审
  role: code_reviewer
  returns_to: ''
  inputs:
  - architecture_design
  - task_plan
  - code_change
  outputs:
  - review_report
  effect: code_review
  routes:
  - when:
    - failed:review_status
    - retries_exhausted
    to: escalate_dev_retry
  - when: failed:review_status
    to: developer
- id: tester_execute
  kind: activity
  name: 测试
  role: tester
  returns_to: ''
  inputs:
  - requirement_spec
  - code_change
  outputs:
  - test_cases
  - test_report
  instruction: 若执行了测试命令，test_report 须引用命令输出中的 AC-*。
  effect: test_execute
  routes:
  - when:
    - failed:test_status
    - retries_exhausted
    to: escalate_dev_retry
  - when: failed:test_status
    to: developer
- id: qa
  kind: activity
  name: 质量门禁
  role: qa
  returns_to: ''
  inputs:
  - requirement_spec
  - test_report
  outputs:
  - qa_report
  instruction: 若需求含 AC-*，须逐条引用测试证据，并在结论块的 ac 中逐条给出 pass / fail / untested。
  effect: qa_gate
  routes:
  - when:
    - failed:qa_status
    - retries_exhausted
    to: escalate_dev_retry
  - when: failed:qa_status
    to: developer
- id: finance_cost_snapshot
  kind: activity
  name: 成本快照
  role: finance
  returns_to: ''
  inputs:
  - qa_report
  outputs:
  - cost_report
  instruction: 根据本轮产物做交付前的成本快照。
  effect: cost_snapshot
  when: feature:finance
- id: project_manager_delivery
  kind: activity
  name: 交付汇总
  role: project_manager
  returns_to: ''
  inputs:
  - test_report
  - qa_report
  outputs:
  - delivery_report
  instruction: 交付报告供最终交付关卡使用。
  effect: delivery
  routes:
  - when: false:delivery_ready
    to: escalate_dev_retry
- id: gate_final_delivery
  kind: gate
  name: 最终交付
  role: human
  returns_to: ''
  decision: approve
- id: config_manager_closeout
  kind: activity
  name: 收口
  role: config_manager
  returns_to: ''
  inputs:
  - baseline_log
  outputs:
  - config_baseline
  - config_retro
  instruction: config_baseline 写交付基线说明，config_retro 写模板与配置复盘。
- id: process_owner_retro
  kind: activity
  name: 复盘
  role: process_owner
  returns_to: ''
  inputs: []
  outputs:
  - process_proposals
  instruction: process_proposals 写流程与角色改进提案。
  effect: retro
  next: end
- id: escalate_dev_retry
  kind: system
  name: 回退升级
  role: human
  returns_to: ''
  handler: escalate_dev_retry
  next: end
- id: hitl_pause
  kind: system
  name: 等待澄清
  role: human
  returns_to: ''
  handler: hitl_pause
  next: end
- id: end
  kind: end
  name: 结束
  role: human
  returns_to: ''
