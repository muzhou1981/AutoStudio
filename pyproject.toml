[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "geni-studio"
version = "0.1.0"
description = "AI 软件工厂：接收人类需求，经多角色 Agent 按工作流程协作，产出经过验证的软件"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "langgraph",
  "langgraph-checkpoint-sqlite>=3.1",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.0",
]

[project.optional-dependencies]
cursor = ["cursor-sdk"]
codex = ["openai-codex==0.167.0"]
dev = ["langgraph-cli[inmem]", "pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
geni-studio = "geni_studio.cli:main"
geni-studio-web = "geni_studio.web.app:main"
geni-studio-feishu-bridge = "geni_studio.hitl.feishu_bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geni_studio"]
